services:
  db:
    image: postgres:15-alpine
    container_name: movietheater-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: movietheater
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/backend
      dockerfile: Dockerfile
    container_name: movietheater-backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - DB_URL=jdbc:postgresql://db:5432/movietheater
      - APP_FRONTEND_URL=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: movietheater-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    external: true
    name: backend_postgres_data
