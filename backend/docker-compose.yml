services:
  # Database
  db:
    image: postgres:15-alpine
    container_name: movie_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: movietheater
      # Sửa lỗi mất dữ liệu của bản Alpine
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d movietheater"]
      interval: 5s
      timeout: 5s
      retries: 12
 
#   Backend Server
  backend:
    build: ./backend
    container_name: movie_backend
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/movietheater
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root

      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy
    restart: always


  # Frontend
  frontend:
    build:
      context: ../frontend/frontend
      args:
        VITE_API_URL: /api
    container_name: movie_frontend
    ports:
      - "3000:80"
    restart: always
    depends_on:
      - backend

volumes:
  postgres_data:
