server.port=8080

# Load local secrets when the application is started from backend/backend (IDE/Maven)
# or from backend (packaged jar). Environment variables still take precedence.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# ==========================================
# DATABASE
# ==========================================
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5433/movietheater}}}
spring.datasource.username=${DB_USER:${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Configuration for Cloud Database (Neon)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=1800000

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# ==========================================
# DATE FORMAT
# ==========================================
spring.mvc.format.date=iso

# ==========================================
# MOVIE STATUS SYNCHRONIZATION
# ==========================================
# Run shortly after startup and then periodically so a missed midnight job
# cannot leave expired movies in NOW_SHOWING.
movie.status-sync-initial-delay-ms=${MOVIE_STATUS_SYNC_INITIAL_DELAY_MS:60000}
movie.status-sync-delay-ms=${MOVIE_STATUS_SYNC_DELAY_MS:300000}

# ==========================================
# SQL INIT (data.sql)
# ==========================================
spring.sql.init.mode=never

# ==========================================
# LOYALTY MEMBERSHIP
# ==========================================
loyalty.amount-per-point=${LOYALTY_AMOUNT_PER_POINT:10000}

# ==========================================
# SEAT SELECTION
# ==========================================
# Transient seat choices live only for the current booking-page session.
seat-selection.hold-duration-seconds=${SEAT_SELECTION_HOLD_DURATION_SECONDS:180}
seat-selection.cleanup-delay-ms=${SEAT_SELECTION_CLEANUP_DELAY_MS:5000}

# ==========================================
# MAIL
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.fallback-to-log=${APP_MAIL_FALLBACK_TO_LOG:true}

# ==========================================
# JWT
# ==========================================
app.security.require-safe-secrets=${APP_REQUIRE_SAFE_SECRETS:false}
jwt.signerKey=${JWT_SIGNER_KEY:}
jwt.validity.duration=24

# ==========================================
# INIT DATA
# ==========================================
app.setup.admin.enabled=${ADMIN_SETUP_ENABLED:false}
app.setup.admin.username=${ADMIN_USERNAME:admin}
app.setup.admin.email=${ADMIN_EMAIL:}
app.setup.admin.password=${ADMIN_PASSWORD:}

# ==========================================
# CLOUDINARY
# ==========================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ==========================================
# ZALOPAY PAYMENT GATEWAY
# ==========================================
zalopay.app-id=${ZALOPAY_APP_ID:2553}
zalopay.key1=${ZALOPAY_KEY1:PcY4iZIKFCIdgZvA6ueMcMHHUbRLYjPL}
zalopay.key2=${ZALOPAY_KEY2:kLtgPl8YEStV61hCnj5fGUmX21O4jDvw}
zalopay.create-endpoint=${ZALOPAY_CREATE_ENDPOINT:https://sb-openapi.zalopay.vn/v2/create}
zalopay.query-endpoint=${ZALOPAY_QUERY_ENDPOINT:https://sb-openapi.zalopay.vn/v2/query}
zalopay.redirect-url=${ZALOPAY_REDIRECT_URL:http://localhost:3000/payment/zalopay/return}
zalopay.callback-url=${ZALOPAY_CALLBACK_URL:http://localhost:8080/payment/zalopay/callback}
zalopay.frontend-payment-url=${ZALOPAY_FRONTEND_PAYMENT_URL:http://localhost:3000/payment/zalopay}
zalopay.order-expire-seconds=${ZALOPAY_ORDER_EXPIRE_SECONDS:900}

# ==========================================
# MOMO PAYMENT GATEWAY
# ==========================================
momo.partner-code=${MOMO_PARTNER_CODE:}
momo.access-key=${MOMO_ACCESS_KEY:}
momo.secret-key=${MOMO_SECRET_KEY:}
momo.create-endpoint=${MOMO_CREATE_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
momo.redirect-url=${MOMO_REDIRECT_URL:http://localhost:3000/payment/momo/return}
momo.ipn-url=${MOMO_IPN_URL:http://localhost:8080/payment/momo/ipn}
momo.request-type=${MOMO_REQUEST_TYPE:payWithMethod}
momo.lang=${MOMO_LANG:vi}
momo.local-mock-enabled=${MOMO_LOCAL_MOCK_ENABLED:false}

# ==========================================
# CORS CONFIG
# ==========================================
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# ==========================================
# TMDB API
# ==========================================
app.tmdb.api-key=${TMDB_API_KEY:}
app.tmdb.base-url=https://api.tmdb.org/3
app.tmdb.image-base-url=https://image.tmdb.org/t/p/original

# ==========================================
# GOOGLE SHEETS / CONTACT MODERATION
# ==========================================
app.google-sheets.api-key=${GOOGLE_SHEETS_API_KEY:}
app.google-sheets.staff-import.spreadsheet-id=${STAFF_IMPORT_SPREADSHEET_ID:}
app.google-sheets.staff-import.range=${STAFF_IMPORT_RANGE:Câu trả lời biểu mẫu 1!A:K}
app.gemini.api-key=${GEMINI_API_KEY:}
